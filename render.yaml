services:
  # Backend Node.js Service
  - type: web
    name: birthday-card-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # Frontend Static Site Service
  - type: web
    name: birthday-card-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Daily Cron Job on Render (fires daily at 06:00 AM)
cron:
  - name: daily-birthday-card-check
    schedule: "0 6 * * *"
    command: curl -X POST https://birthday-card-backend.onrender.com/api/cron/trigger
